name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: >-
          gcloud builds submit services/api
          --tag "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/power-alert/api:${{ github.sha }}"
      - name: Deploy Cloud Run
        run: >-
          gcloud run deploy power-alert-api
          --image "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/power-alert/api:${{ github.sha }}"
          --region "${{ secrets.GCP_REGION }}"
          --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          --platform managed
          --allow-unauthenticated
          --min-instances 1
          --max-instances 100
          --concurrency 80
          --cpu 1
          --memory 512Mi
          --set-env-vars "NODE_ENV=${{ inputs.environment }},GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},APP_CHECK_ENFORCED=true"
