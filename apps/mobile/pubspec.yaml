publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.5.0
  firebase_analytics: ^12.0.0
  firebase_app_check: ^0.4.4+2
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.0.0
