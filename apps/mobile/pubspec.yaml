  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  google_maps_flutter: ^2.17.1
  http: ^1.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
